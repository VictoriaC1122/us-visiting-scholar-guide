<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>找不到頁面｜美國訪問學者申請分享</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;600;700&amp;family=Noto+Serif+TC:wght@500;600&amp;display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; display: grid; place-items: center; margin: 0; padding: 24px; color: #474457; background: linear-gradient(145deg, #f3eff7, #eef3fa); font-family: "Noto Serif TC", "Songti TC", serif; }
    main { width: min(680px, 100%); padding: clamp(38px, 8vw, 72px); border: 1px solid rgba(83,79,109,.08); border-radius: 28px; background: #fdfcfe; box-shadow: 0 24px 70px rgba(76,72,98,.08); }
    p:first-child { margin: 0 0 8px; color: #756a94; font-family: "Noto Sans TC", sans-serif; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 0 0 18px; color: #403d4f; font-size: clamp(34px, 8vw, 52px); font-weight: 600; line-height: 1.3; }
    p { color: #67647a; line-height: 1.85; }
    a { min-height: 46px; display: inline-flex; align-items: center; margin-top: 16px; padding: 9px 17px; border-radius: 12px; color: #fff; background: #675b86; font-family: "Noto Sans TC", sans-serif; font-size: 14px; font-weight: 700; text-decoration: none; }
    a:focus-visible { outline: 3px solid #675b86; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <p>404 · PAGE NOT FOUND</p>
    <h1>找不到這個頁面</h1>
    <p>網址可能已經變更，請回到文章首頁。</p>
    <a href="./">返回首頁&nbsp; →</a>
  </main>
</body>
</html>
